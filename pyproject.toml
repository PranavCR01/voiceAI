[project]
name = "voiceai"
version = "0.1.0"
description = "Voice-stack recommender: use-case profile in, recommended STT/turn-detection/LLM/TTS stack out."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jiwer>=4.0.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "whisper-normalizer>=0.1.15",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "recommender"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["harness", "recommender"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Ships no type information.
module = ["whisper_normalizer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
