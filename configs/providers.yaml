# STT provider configurations. One entry per configuration being compared.
# Every value below comes from docs/RESEARCH.md (research dated October 2026, mostly third-party
# price trackers) and is marked `verify: true` until checked against the vendor's own docs and
# pricing page. Vendor docs became reachable from cloud sessions on 2026-11-05; the ElevenLabs and
# AssemblyAI API hosts still are not, so those entries are doc-checked but unrun.
# When verifying: update model_id/settings/pricing, set pricing.source to the vendor page,
# pricing.as_of to the check date, and verify: false. Field reference: harness/providers/registry.py

configs:
  # --- batch (pre-recorded) --------------------------------------------------------------
  - config_id: deepgram_nova3_batch
    provider: deepgram
    model_id: nova-3
    mode: batch
    settings: {smart_format: true, punctuate: true}
    pricing:
      amount: 0.0043
      unit: minute
      billing_basis: audio_duration
      source: https://dynalord.com/blog/deepgram-pricing
      as_of: 2026-10-06
    output_date_order: mdy  # smart_format writes 04/20/1980 even for en-GB audio (observed 2026-11-04)
    env_key: DEEPGRAM_API_KEY
    verify: true

  - config_id: deepgram_nova3_batch_keyterms
    provider: deepgram
    model_id: nova-3
    mode: batch
    settings: {smart_format: true, punctuate: true, keyterms: lexicon}
    pricing:
      amount: 0.0043
      unit: minute
      billing_basis: audio_duration
      source: https://dynalord.com/blog/deepgram-pricing
      as_of: 2026-10-06
    output_date_order: mdy  # smart_format writes 04/20/1980 even for en-GB audio (observed 2026-11-04)
    env_key: DEEPGRAM_API_KEY
    verify: true
    notes: >-
      ORACLE: boosts the profile's scoring lexicon, which for healthcare_intake was drawn from
      PriMock57's own transcripts, so its gain on PriMock57 is an upper bound. Compare with
      deepgram_nova3_batch_keyterms_common. Price and any keyterm surcharge unverified.

  - config_id: deepgram_nova3_batch_keyterms_common
    provider: deepgram
    model_id: nova-3
    mode: batch
    settings: {smart_format: true, punctuate: true, keyterms: profile}
    pricing:
      amount: 0.0043
      unit: minute
      billing_basis: audio_duration
      source: https://dynalord.com/blog/deepgram-pricing
      as_of: 2026-10-06
    output_date_order: mdy  # smart_format writes 04/20/1980 even for en-GB audio (observed 2026-11-04)
    env_key: DEEPGRAM_API_KEY
    verify: true
    notes: >-
      Boosts the profile's keyterm list (healthcare_intake: data/lexicons/openfda_rx_generics.txt
      since 2026-11-05, before that common_uk_generics.txt; run.json records which), written
      without reference to the test set: what a deployment could know in advance.

  - config_id: assemblyai_batch
    provider: assemblyai
    model_id: universal-3-5-pro  # sent as speech_models: [id]; "universal" is not a valid id
    mode: batch
    # language_code: without it the language is auto-detected (API reference 2026-11-05).
    settings: {format_text: true, punctuate: true, language_code: en}
    pricing:
      amount: 0.21
      unit: hour
      billing_basis: audio_duration  # pro-rated per second (docs: billing-and-pricing)
      source: https://www.assemblyai.com/pricing
      as_of: 2026-11-05
    env_key: ASSEMBLYAI_API_KEY
    verify: true  # request shape checked against the API reference 2026-11-05; no live run yet
    notes: Keyterms prompting adds $0.05/hour on Universal-3.5 Pro (pricing page, 2026-11-05).

  - config_id: elevenlabs_scribe_v2_batch
    provider: elevenlabs
    model_id: scribe_v2
    mode: batch
    # language_code: Scribe auto-detects language by default (Deepgram defaults to en); pinned so
    # one-word backchannels can't be read as another language. temperature: the default is
    # "based on the model, usually 0"; pinned so a default change can't alter a re-run.
    settings: {language_code: en, temperature: 0}
    pricing:
      amount: 0.22
      unit: hour
      billing_basis: audio_duration
      source: https://elevenlabs.io/pricing/api
      as_of: 2026-11-05
    env_key: ELEVENLABS_API_KEY
    verify: true  # request shape checked against the API reference 2026-11-05; no live run yet
    notes: >-
      Subscription credits: 330 per minute of audio (elevenlabs.io/pricing, 2026-11-05).
      Keyterms add $0.05/hour (pricing page) / 20% (API reference); more than 100 keyterms bill
      each request for at least 20 s, which the adapter refuses.

  # --- streaming (the v1 comparison set) ---------------------------------------------------
  - config_id: deepgram_nova3_stream
    provider: deepgram
    model_id: nova-3
    mode: streaming
    settings: {interim_results: true, smart_format: true, endpointing: 300}
    pricing:
      amount: 0.0077
      unit: minute
      billing_basis: audio_duration
      source: https://flexprice.io/pricing-index/deepgram
      as_of: 2026-10-06
    env_key: DEEPGRAM_API_KEY
    verify: true
    notes: Regular rate; a promotional $0.0048/min was also listed. Model both in cost analysis.

  - config_id: deepgram_flux_stream
    provider: deepgram
    model_id: flux-general-en
    mode: streaming
    settings: {}
    pricing:
      amount: 0.0065
      unit: minute
      billing_basis: audio_duration
      source: https://www.happyrobot.ai/hub/deepgram-pricing
      as_of: 2026-10-06
    env_key: DEEPGRAM_API_KEY
    verify: true
    notes: Built-in end-of-turn detection; end-of-turn thresholds are the endpointing knobs.

  - config_id: assemblyai_universal_stream
    provider: assemblyai
    model_id: universal-streaming
    mode: streaming
    settings: {}
    pricing:
      amount: 0.15
      unit: hour
      billing_basis: session_duration
      source: https://www.assemblyai.com/blog/introducing-universal-streaming
      as_of: 2026-10-06
    env_key: ASSEMBLYAI_API_KEY
    verify: true
    notes: Billed while the session is open, including while the agent talks. Keyterms +$0.04/hr.

  - config_id: elevenlabs_scribe_v2_rt_stream
    provider: elevenlabs
    model_id: scribe_v2_realtime
    mode: streaming
    settings: {}
    pricing:
      amount: 0.39
      unit: hour
      billing_basis: audio_duration
      source: https://elevenlabs.io/pricing/api
      as_of: 2026-11-05
    env_key: ELEVENLABS_API_KEY
    verify: true
    notes: Price confirmed on the vendor page 2026-11-05; billing on audio pushed and the 10-minute session cap are still third-party claims (verify).
