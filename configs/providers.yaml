# STT provider configurations. One entry per configuration being compared.
# Every value below comes from docs/RESEARCH.md (research dated October 2026, mostly third-party
# price trackers) and is marked `verify: true` until checked against the vendor's own docs and
# pricing page. Vendor docs became reachable from cloud sessions on 2026-11-05; the ElevenLabs and
# AssemblyAI API hosts still are not, so those entries are doc-checked but unrun.
# When verifying: update model_id/settings/pricing, set pricing.source to the vendor page,
# pricing.as_of to the check date, and verify: false. Field reference: harness/providers/registry.py

configs:
  # --- batch (pre-recorded) --------------------------------------------------------------
  - config_id: deepgram_nova3_batch
    provider: deepgram
    model_id: nova-3
    mode: batch
    settings: {smart_format: true, punctuate: true}
    pricing:
      amount: 0.0043
      unit: minute
      billing_basis: audio_duration
      source: https://deepgram.com/pricing
      as_of: 2026-11-05
    output_date_order: mdy  # smart_format writes 04/20/1980 even for en-GB audio (observed 2026-11-04)
    env_key: DEEPGRAM_API_KEY
    verify: false

  - config_id: deepgram_nova3_batch_keyterms
    provider: deepgram
    model_id: nova-3
    mode: batch
    settings: {smart_format: true, punctuate: true, keyterms: lexicon}
    pricing:
      amount: 0.0056  # $0.0043 Nova-3 pre-recorded + $0.0013 keyterm prompting
      unit: minute
      billing_basis: audio_duration
      source: https://deepgram.com/pricing
      as_of: 2026-11-05
    output_date_order: mdy  # smart_format writes 04/20/1980 even for en-GB audio (observed 2026-11-04)
    env_key: DEEPGRAM_API_KEY
    verify: false
    notes: >-
      ORACLE: boosts the profile's scoring lexicon, which for healthcare_intake was drawn from
      PriMock57's own transcripts, so its gain on PriMock57 is an upper bound. Compare with
      deepgram_nova3_batch_keyterms_common.

  - config_id: deepgram_nova3_batch_keyterms_common
    provider: deepgram
    model_id: nova-3
    mode: batch
    settings: {smart_format: true, punctuate: true, keyterms: profile}
    pricing:
      amount: 0.0056  # $0.0043 Nova-3 pre-recorded + $0.0013 keyterm prompting
      unit: minute
      billing_basis: audio_duration
      source: https://deepgram.com/pricing
      as_of: 2026-11-05
    output_date_order: mdy  # smart_format writes 04/20/1980 even for en-GB audio (observed 2026-11-04)
    env_key: DEEPGRAM_API_KEY
    verify: false
    notes: >-
      Boosts the profile's keyterm list (healthcare_intake: data/lexicons/openfda_rx_generics.txt
      since 2026-11-05, before that common_uk_generics.txt; run.json records which), written
      without reference to the test set: what a deployment could know in advance.

  - config_id: assemblyai_batch
    provider: assemblyai
    model_id: universal-3-5-pro  # sent as speech_models: [id]; "universal" is not a valid id
    mode: batch
    # language_code: without it the language is auto-detected (API reference 2026-11-05).
    settings: {format_text: true, punctuate: true, language_code: en}
    pricing:
      amount: 0.21
      unit: hour
      billing_basis: audio_duration  # pro-rated per second (docs: billing-and-pricing)
      source: https://www.assemblyai.com/pricing
      as_of: 2026-11-05
    env_key: ASSEMBLYAI_API_KEY
    verify: false
    notes: Keyterms prompting adds $0.05/hour on Universal-3.5 Pro (pricing page, 2026-11-05).

  - config_id: elevenlabs_scribe_v2_batch
    provider: elevenlabs
    model_id: scribe_v2
    mode: batch
    # language_code: Scribe auto-detects language by default (Deepgram defaults to en); pinned so
    # one-word backchannels can't be read as another language. temperature: the default is
    # "based on the model, usually 0"; pinned so a default change can't alter a re-run.
    settings: {language_code: en, temperature: 0}
    pricing:
      amount: 0.22
      unit: hour
      billing_basis: audio_duration
      source: https://elevenlabs.io/pricing/api
      as_of: 2026-11-05
    env_key: ELEVENLABS_API_KEY
    verify: false
    notes: >-
      Measured 2026-11-05 from response headers: 18 credits / $0.0036 per audio minute, rounded
      up to a whole credit per request (the pricing page's "330 credits per minute" is wrong
      for this API). Writes dates as spoken ("the 2nd of November, 1992"), never digits. Keyterms add $0.05/hour (pricing page) / 20% (API reference); more than 100 keyterms bill
      each request for at least 20 s, which the adapter refuses.

  - config_id: elevenlabs_scribe_v2_batch_keyterms_common
    provider: elevenlabs
    model_id: scribe_v2
    mode: batch
    settings: {language_code: en, temperature: 0, keyterms: profile}
    pricing:
      amount: 0.27  # $0.22/h + $0.05/h keyterms (pricing page)
      unit: hour
      billing_basis: audio_duration
      source: https://elevenlabs.io/pricing/api
      as_of: 2026-11-05
    env_key: ELEVENLABS_API_KEY
    verify: false
    notes: >-
      Boosts the profile's keyterm list (healthcare_intake: data/lexicons/openfda_rx_generics.txt,
      100 terms, the most the adapter allows). Compare with deepgram_nova3_batch_keyterms_common.

  - config_id: elevenlabs_scribe_v2_medical_batch
    provider: elevenlabs
    model_id: scribe_v2_medical
    mode: batch
    settings: {language_code: en, temperature: 0}
    pricing:
      amount: 0.22  # "same pricing as Scribe v2" (models page)
      unit: hour
      billing_basis: audio_duration
      source: https://elevenlabs.io/docs/overview/models
      as_of: 2026-11-05
    env_key: ELEVENLABS_API_KEY
    verify: false
    notes: >-
      Fine-tune of Scribe v2 for clinical vocabulary (vendor claim: 35% fewer errors on clinical
      audio). Not boosted, so it compares directly with elevenlabs_scribe_v2_batch.

  # --- streaming (the v1 comparison set) ---------------------------------------------------
  - config_id: deepgram_nova3_stream
    provider: deepgram
    model_id: nova-3
    mode: streaming
    settings: {interim_results: true, smart_format: true, endpointing: 300}
    pricing:
      amount: 0.0077
      unit: minute
      billing_basis: audio_duration
      source: https://deepgram.com/pricing
      as_of: 2026-11-05
    env_key: DEEPGRAM_API_KEY
    verify: false  # docs + live probe 2026-11-05 (docs/RESEARCH.md)
    notes: Pay-as-you-go streaming rate (Growth $0.0065). Keyterm prompting +$0.0013/min.

  - config_id: deepgram_flux_stream
    provider: deepgram
    model_id: flux-general-en
    mode: streaming
    settings: {}
    pricing:
      amount: 0.0077
      unit: minute
      billing_basis: audio_duration
      source: https://deepgram.com/pricing
      as_of: 2026-11-05
    env_key: DEEPGRAM_API_KEY
    verify: false  # docs + live probe 2026-11-05 (docs/RESEARCH.md)
    notes: >-
      Pay-as-you-go rate (Growth $0.0065). Built-in end-of-turn detection; knobs eot_threshold,
      eager_eot_threshold, eot_timeout_ms. Word start times are contiguous on an ~80 ms grid
      (only end times are precise), observed 2026-11-05.

  - config_id: assemblyai_universal_stream
    provider: assemblyai
    model_id: universal-streaming-english  # docs 2026-11-05: valid ids are universal-3-6-pro, universal-3-5-pro, universal-streaming-english/-multilingual
    mode: streaming
    # format_turns: formatted finals (punctuation, digits) like Deepgram smart_format / Scribe; the
    # final then waits for the formatted end-of-turn message (probe 2026-11-05)
    settings: {format_turns: true}
    pricing:
      amount: 0.15
      unit: hour
      billing_basis: session_duration
      source: https://www.assemblyai.com/pricing
      as_of: 2026-11-05
    env_key: ASSEMBLYAI_API_KEY
    verify: false  # docs + live probe 2026-11-05 (docs/RESEARCH.md)
    notes: Billed while the session is open, including while the agent talks. Keyterms +$0.04/hr.

  - config_id: elevenlabs_scribe_v2_rt_stream
    provider: elevenlabs
    model_id: scribe_v2_realtime
    mode: streaming
    # trailing silence > Scribe's 1.5 s default VAD silence, so its own commit can fire (probe 2026-11-05)
    settings: {trailing_silence_ms: 3000}
    pricing:
      amount: 0.39
      unit: hour
      billing_basis: audio_duration
      source: https://elevenlabs.io/pricing/api
      as_of: 2026-11-05
    env_key: ELEVENLABS_API_KEY
    verify: false  # docs + live probe 2026-11-05 (docs/RESEARCH.md)
    notes: >-
      Billed on audio sent, silence included (docs). Session cap value not stated in the docs;
      the server reports session_time_limit_exceeded. Keyterms: <= 50 terms of <= 20 chars.
