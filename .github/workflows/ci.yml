name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy harness recommender
      - name: Fetch Silero VAD model (pinned wheel, sha256-checked)
        run: python3 data/fetch_silero_vad.py
      - name: Tests
        run: uv run pytest
        env:
          REQUIRE_SILERO: "1"  # model tests must run in CI, not skip
